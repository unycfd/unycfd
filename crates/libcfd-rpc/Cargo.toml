[package]
name = "unycfd-rpc"
version = "0.3.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/unycfd/unycfd"
description = "Cap'n Proto RPC wire framing with Send futures for unycfd (fork of libcfd-rpc)"

[lib]
name = "libcfd_rpc"
path = "src/lib.rs"

[dependencies]
capnp = "0.27"
futures-io = "0.3"
thiserror = "2"
tracing = "0.1"

[build-dependencies]
capnpc = "0.27"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1.53", features = ["macros", "rt", "io-util"] }
