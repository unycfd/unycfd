[package]
name = "unycfd"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Tiny high-performance Cloudflare Tunnel (cloudflared) daemon in Rust with < 3 MB memory footprint"

[[bin]]
name = "unycfd"
path = "src/main.rs"

[dependencies]
libcfd = { version = "0.3.0", path = "../libcfd" }
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "net",
    "io-util",
    "time",
    "macros",
    "signal",
] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
http = "1.5"
httparse = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
lexopt = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
