name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recreate GitHub Release cleanly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release delete "${{ github.ref_name }}" --yes || \
              (sleep 3 && gh release delete "${{ github.ref_name }}" --yes) || true
            sleep 2
          fi
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes || \
            (sleep 3 && gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes)

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (statically linked musl, runs on any Linux distribution)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux ARM64 (statically linked musl, runs on any ARM64 server/Raspberry Pi)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # macOS Apple Silicon (M1/M2/M3/M4)
          - target: aarch64-apple-darwin
            os: macos-latest
          # macOS Intel (cross-compiled on macos-latest)
          - target: x86_64-apple-darwin
            os: macos-latest
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: unycfd
          target: ${{ matrix.target }}
          archive: $bin-$target
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload raw binary (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "target/${{ matrix.target }}/release/unycfd" "unycfd-${{ matrix.target }}"
          gh release upload "${{ github.ref_name }}" "unycfd-${{ matrix.target }}" --clobber || \
            (sleep 3 && gh release upload "${{ github.ref_name }}" "unycfd-${{ matrix.target }}" --clobber) || \
            (sleep 5 && gh release upload "${{ github.ref_name }}" "unycfd-${{ matrix.target }}" --clobber)
      - name: Upload raw binary (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item "target\${{ matrix.target }}\release\unycfd.exe" "unycfd-${{ matrix.target }}.exe"
          for ($i=1; $i -le 3; $i++) {
            gh release upload "${{ github.ref_name }}" "unycfd-${{ matrix.target }}.exe" --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds 3
          }
